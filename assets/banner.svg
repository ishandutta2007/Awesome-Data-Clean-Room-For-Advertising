<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 42px; fill: url(#textGrad); }
    .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 18px; fill: #94a3b8; }
    .tag { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }

    /* Keyframe Animations */
    @keyframes pulseParticle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.4); }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes dataStream {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }

    .particle { animation: pulseParticle 4s infinite ease-in-out; }
    .p1 { animation-delay: 0s; }
    .p2 { animation-delay: 1.5s; }
    .p3 { animation-delay: 2.5s; }
    
    .floating-bg { animation: floatCard 6s infinite ease-in-out; }
    .stream-line { stroke-dasharray: 10 15; animation: dataStream 3s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Dynamic Background Elements (Behind text & headers) -->
  <g class="floating-bg" opacity="0.6">
    <!-- Clean Room Nodes / Grid graphics -->
    <circle cx="150" cy="80" r="40" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" />
    <circle cx="150" cy="80" r="70" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 8" stroke-opacity="0.3" />
    
    <circle cx="1050" cy="240" r="50" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.2" />
    <circle cx="1050" cy="240" r="90" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 6" stroke-opacity="0.2" />

    <!-- Connecting lines -->
    <path d="M 150 80 Q 300 20 450 80 T 750 80 T 1050 240" fill="none" stroke="#38bdf8" stroke-width="1.5" class="stream-line" opacity="0.4" />
  </g>

  <!-- Interactive Data Particles (Dynamic Aspect) -->
  <circle cx="200" cy="220" r="6" fill="#38bdf8" class="particle p1" filter="url(#glowBlue)" />
  <circle cx="1000" cy="90" r="8" fill="#c084fc" class="particle p2" filter="url(#glowBlue)" />
  <circle cx="850" cy="270" r="5" fill="#818cf8" class="particle p3" filter="url(#glowBlue)" />
  <circle cx="120" cy="180" r="4" fill="#38bdf8" class="particle p2" />

  <!-- Foreground Glassmorphism Banner Frame (Ensures title/subtitle remain perfectly legible) -->
  <rect x="60" y="45" width="1080" height="230" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

  <!-- Pill Tag -->
  <g transform="translate(90, 75)">
    <rect width="250" height="28" rx="14" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <text x="12" y="18" class="tag">🔒 PRIVACY-PRESERVING TECH</text>
  </g>

  <!-- Foreground Text Content -->
  <text x="90" y="145" class="title">Awesome Data Clean Room For Advertising</text>
  <text x="90" y="185" class="subtitle">Curated directory of enterprise SaaS platforms, open-source TEE frameworks &amp; privacy-enhancing tech</text>

  <!-- Decorative Feature Badges inside Banner -->
  <g transform="translate(90, 215)">
    <!-- Feature 1 -->
    <rect x="0" y="0" width="140" height="30" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="12" y="19" font-family="sans-serif" font-size="12" fill="#cbd5e1">🛡️ TEE &amp; MPC</text>

    <!-- Feature 2 -->
    <rect x="150" y="0" width="170" height="30" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="12" y="19" font-family="sans-serif" font-size="12" fill="#cbd5e1">📊 Differential Privacy</text>

    <!-- Feature 3 -->
    <rect x="330" y="0" width="160" height="30" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="12" y="19" font-family="sans-serif" font-size="12" fill="#cbd5e1">⚡ Zero-Data Movement</text>
  </g>
</svg>
